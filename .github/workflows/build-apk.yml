name: Build AVA PET APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ava-pet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      HOME: /home/runner
      BUILDOZER_HOME: /home/runner/.buildozer
      GRADLE_USER_HOME: /home/runner/.gradle
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/28.2.13676358
      P4A_HOME: /home/runner/.buildozer/android/platform/python-for-android
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "false"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget ca-certificates \
            openjdk-17-jdk ant \
            autoconf automake autopoint libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev \
            cmake build-essential patch ccache

      - name: Install Buildozer toolchain
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython==0.29.37" virtualenv
          buildozer --version
          cython --version

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="$ANDROID_HOME"
          TOOLS_ROOT="$SDK_ROOT/cmdline-tools"
          TOOLS_DIR="$TOOLS_ROOT/latest"
          rm -rf "$SDK_ROOT"
          mkdir -p "$TOOLS_ROOT" "$TOOLS_DIR"
          curl -fL --retry 5 --retry-all-errors -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          rm -rf /tmp/android-cmdline-tools
          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline-tools
          SDKMANAGER_SRC="$(find /tmp/android-cmdline-tools -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER_SRC"
          SDKMANAGER_BIN_DIR="$(dirname "$SDKMANAGER_SRC")"
          cp -a "$SDKMANAGER_BIN_DIR/.."/. "$TOOLS_DIR/"
          chmod +x "$TOOLS_DIR/bin/sdkmanager" "$TOOLS_DIR/bin/avdmanager"
          test -x "$TOOLS_DIR/bin/sdkmanager"
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sfn "$TOOLS_DIR/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          ln -sfn "$TOOLS_DIR/bin/avdmanager" "$SDK_ROOT/tools/bin/avdmanager"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          "$TOOLS_DIR/bin/sdkmanager" --version
          "$SDK_ROOT/tools/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /tmp/sdk-licenses.log 2>&1
          SDK_LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          cat /tmp/sdk-licenses.log
          test "$SDK_LICENSE_STATUS" -eq 0
          grep -q "All SDK package licenses accepted" /tmp/sdk-licenses.log

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -d "$ANDROID_HOME/platforms/android-30"
          test -f "$ANDROID_NDK_HOME/source.properties"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          python --version
          buildozer --version
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          test -x "$ANDROID_HOME/tools/bin/sdkmanager"
          "$SDKMANAGER" --version
          "$ANDROID_HOME/tools/bin/sdkmanager" --version
          "$ANDROID_HOME/platform-tools/adb" version
          test -f buildozer.spec
          test -f main.py

      - name: Prepare clean writable build directories
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /root/.buildozer /root/.gradle
          rm -rf "$BUILDOZER_HOME" "$GRADLE_USER_HOME" .buildozer bin
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate project configuration
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^requirements = python3,kivy,pyjnius' buildozer.spec
          grep -q '^android.api = 30' buildozer.spec
          grep -q '^android.minapi = 23' buildozer.spec
          grep -q '^android.sdk_path = /home/runner/android-sdk' buildozer.spec
          grep -q '^android.ndk_path = /home/runner/android-sdk/ndk/28.2.13676358' buildozer.spec
          grep -q '^android.archs = arm64-v8a' buildozer.spec

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          if [ -d "$P4A_HOME" ]; then
            buildozer android clean || true
          fi
          buildozer android debug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "Generated APK: $APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
