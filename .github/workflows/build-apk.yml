name: Build AVA PET APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ava-pet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HOME: /home/runner
      BUILDOZER_HOME: /home/runner/.buildozer
      GRADLE_USER_HOME: /home/runner/.gradle
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/28.2.13676358
      P4A_HOME: /home/runner/.buildozer/android/platform/python-for-android
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl wget ca-certificates openjdk-17-jdk ant autoconf automake autopoint libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev cmake build-essential patch ccache

      - name: Install Buildozer
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython==0.29.37" virtualenv
          buildozer --version

      - name: Install Android command line tools
        run: |
          set -euxo pipefail
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fL --retry 5 --retry-all-errors -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          rm -rf /tmp/android-cmdline-tools
          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline-tools
          SRC="$(find /tmp/android-cmdline-tools -type f -name sdkmanager -print -quit)"
          test -n "$SRC"
          cp -a "$(dirname "$SRC")/.."/. "$ANDROID_HOME/cmdline-tools/latest/"
          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /tmp/sdk-licenses.log 2>&1 || {
            status=${PIPESTATUS[1]}
            if [ "$status" -ne 0 ]; then
              cat /tmp/sdk-licenses.log
              exit "$status"
            fi
          }
          cat /tmp/sdk-licenses.log

      - name: Install Android SDK and NDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-30" "build-tools;35.0.0" "ndk;28.2.13676358"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -d "$ANDROID_HOME/platforms/android-30"
          test -f "$ANDROID_NDK_HOME/source.properties"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Validate project files
        run: |
          set -euxo pipefail
          test -f buildozer.spec
          test -f main.py
          grep -q '^requirements = python3,kivy,pyjnius' buildozer.spec
          grep -q '^android.api = 30' buildozer.spec
          grep -q '^android.minapi = 23' buildozer.spec
          grep -q '^android.archs = arm64-v8a' buildozer.spec

      - name: Prepare clean writable environment
        run: |
          set -euxo pipefail
          sudo rm -rf /root/.buildozer /root/.gradle
          rm -rf "$BUILDOZER_HOME" "$GRADLE_USER_HOME" .buildozer bin
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          java -version
          python --version
          buildozer --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build debug APK
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          buildozer android debug

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
