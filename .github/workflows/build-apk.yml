name: Build AVA PET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            libltdl-dev cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython==0.29.37"

      - name: Configure Buildozer environment
        shell: bash
        run: |
          echo "BUILDOZER_HOME=$HOME/.buildozer" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.buildozer"
          chmod -R u+rwX "$HOME/.buildozer"

      - name: Remove stale Buildozer state
        run: |
          rm -rf .buildozer bin
          mkdir -p bin

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer android debug

      - name: Verify APK
        run: |
          shopt -s nullglob
          apks=(bin/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: Build finished but no APK was produced."
            exit 1
          fi
          printf 'APK: %s\n' "${apks[@]}"
          ls -lh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-APK
          path: bin/*.apk
          if-no-files-found: error
