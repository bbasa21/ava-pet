name: Build AVA PET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ava-pet-apk-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Buildozer must never resolve its home to /root on the GitHub runner.
  BUILDOZER_HOME: /home/runner/.buildozer
  P4A_HOME: /home/runner/.buildozer/android/platform/python-for-android
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  GRADLE_USER_HOME: /home/runner/.gradle
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify project files
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildozer.spec
          test -f main.py
          echo "Project files OK"
          python --version
          git --version

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget ca-certificates \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            libltdl-dev cmake

      - name: Prepare clean Buildozer environment
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$BUILDOZER_HOME"
          rm -rf "$GRADLE_USER_HOME"
          rm -rf .buildozer bin
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME" bin
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          echo "BUILDOZER_HOME=$BUILDOZER_HOME"
          echo "HOME=$HOME"
          id
          test "$(id -u)" != "0"

      - name: Install Buildozer and Python build tools
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython==0.29.37"
          buildozer --version
          cython --version

      - name: Validate Buildozer configuration
        shell: bash
        run: |
          set -euxo pipefail
          echo '--- buildozer.spec ---'
          cat buildozer.spec
          echo '--- environment ---'
          env | grep -E '^(HOME|BUILDOZER_HOME|P4A_HOME|ANDROID_HOME|ANDROID_SDK_ROOT|GRADLE_USER_HOME)=' | sort

      - name: Build APK
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -euxo pipefail
          export HOME=/home/runner
          export BUILDOZER_HOME=/home/runner/.buildozer
          export P4A_HOME=/home/runner/.buildozer/android/platform/python-for-android
          export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          export GRADLE_USER_HOME=/home/runner/.gradle
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          buildozer android debug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(bin/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: Build finished but no APK was produced."
            echo "--- Buildozer directory ---"
            find "$BUILDOZER_HOME" -maxdepth 5 -type f 2>/dev/null | head -200 || true
            exit 1
          fi
          printf 'APK: %s\n' "${apks[@]}"
          ls -lh bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
