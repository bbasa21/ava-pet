name: Build AVA PET APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ava-pet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      HOME: /home/runner
      BUILDOZER_HOME: /home/runner/.buildozer
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/25.1.8937393
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/25.1.8937393
      P4A_HOME: /home/runner/.buildozer/android/platform/python-for-android
      GRADLE_USER_HOME: /home/runner/.gradle
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            libltdl-dev cmake

      - name: Install Python build tools
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer>=1.5.0" \
            "cython==0.29.37" \
            virtualenv

      - name: Prepare clean writable build environment
        run: |
          set -euxo pipefail
          sudo rm -rf /root/.buildozer /root/.gradle
          rm -rf "$BUILDOZER_HOME" "$GRADLE_USER_HOME" "$ANDROID_HOME"
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME" "$ANDROID_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME" "$ANDROID_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK packages and accept licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;25.1.8937393"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          python --version
          buildozer --version
          git --version

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-30"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -d "$ANDROID_NDK_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "Build-tools: $ANDROID_HOME/build-tools/35.0.0"

      - name: Clean previous Buildozer state
        run: |
          set -euxo pipefail
          rm -rf .buildozer bin
          rm -rf "$P4A_HOME"
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          export HOME=/home/runner
          export BUILDOZER_HOME=/home/runner/.buildozer
          export ANDROID_HOME=/home/runner/android-sdk
          export ANDROID_SDK_ROOT=/home/runner/android-sdk
          export ANDROID_NDK_HOME=/home/runner/android-sdk/ndk/25.1.8937393
          export ANDROID_NDK_ROOT=/home/runner/android-sdk/ndk/25.1.8937393
          export P4A_HOME=/home/runner/.buildozer/android/platform/python-for-android
          export GRADLE_USER_HOME=/home/runner/.gradle

          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"

          # Keep Buildozer/p4a on the runner's writable HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          buildozer android debug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          echo "APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print
          APK="$(find bin -maxdepth 1 -type f -name "*.apk" -print -quit)"
          test -n "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
