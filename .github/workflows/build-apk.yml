name: Build AVA PET APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ava-pet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HOME: /home/runner
      BUILDOZER_HOME: /home/runner/.buildozer
      GRADLE_USER_HOME: /home/runner/.gradle
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/25.1.8937393
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/25.1.8937393
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget ca-certificates \
            ant autoconf automake autopoint libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev \
            cmake build-essential patch ccache

      - name: Install Buildozer
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37" \
            virtualenv
          buildozer --version
          cython --version

      - name: Install Android command line tools
        run: |
          set -euxo pipefail
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          rm -rf /tmp/android-cmdline-tools
          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline-tools
          test -x /tmp/android-cmdline-tools/cmdline-tools/bin/sdkmanager
          mv /tmp/android-cmdline-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"

          # Buildozer 1.6.0 may probe the legacy SDK path:
          #   $ANDROID_HOME/tools/bin/sdkmanager
          # Do NOT symlink tools/bin directly to cmdline-tools/latest/bin.
          # sdkmanager resolves its own ../lib path relative to its script,
          # so a symlink makes it look for the libraries under tools/lib.
          # Use tiny wrapper scripts that jump to the real modern binaries.
          rm -rf "$ANDROID_HOME/tools"
          mkdir -p "$ANDROID_HOME/tools/bin"

          cat > "$ANDROID_HOME/tools/bin/sdkmanager" <<'EOF'
#!/usr/bin/env bash
exec /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"
EOF

          cat > "$ANDROID_HOME/tools/bin/avdmanager" <<'EOF'
#!/usr/bin/env bash
exec /home/runner/android-sdk/cmdline-tools/latest/bin/avdmanager "$@"
EOF

          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/avdmanager"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

          test -x "$ANDROID_HOME/tools/bin/sdkmanager"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -d "$ANDROID_HOME/cmdline-tools/latest/lib"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses \
            > /tmp/sdk-licenses.log 2>&1
          SDK_STATUS=${PIPESTATUS[1]}
          set -e
          cat /tmp/sdk-licenses.log
          if [ "$SDK_STATUS" -ne 0 ]; then
            exit "$SDK_STATUS"
          fi

      - name: Install Android SDK and NDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;25.1.8937393"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -d "$ANDROID_HOME/platforms/android-30"
          test -f "$ANDROID_NDK_HOME/source.properties"

      - name: Validate AVA PET configuration
        run: |
          set -euxo pipefail
          test -f buildozer.spec
          test -f main.py
          grep -q '^requirements = python3==3.11.5,kivy==2.3.1,pyjnius==1.6.1' buildozer.spec
          grep -q '^android.api = 30' buildozer.spec
          grep -q '^android.minapi = 23' buildozer.spec
          grep -q '^android.ndk_api = 23' buildozer.spec
          grep -q '^android.archs = arm64-v8a' buildozer.spec
          grep -q '^p4a.commit = 957a3e5f8c270f7aa648ba185e5a68c1077a798d' buildozer.spec

      - name: Prepare clean Buildozer environment
        run: |
          set -euxo pipefail
          rm -rf .buildozer bin "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build debug APK
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          set +e
          buildozer android debug > /tmp/ava-pet-build.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "===== BUILD FAILED ====="
            tail -n 200 /tmp/ava-pet-build.log || true
            echo "===== ERROR SUMMARY ====="
            grep -E -i 'error:|fatal:|exception|traceback|failed|failure|exit code|command failed' \
              /tmp/ava-pet-build.log | tail -n 200 || true
            exit "$STATUS"
          fi
          echo "===== BUILD FINISHED ====="
          tail -n 100 /tmp/ava-pet-build.log || true

      - name: Verify generated APK
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-build-log
          path: /tmp/ava-pet-build.log
          if-no-files-found: ignore
          retention-days: 7
