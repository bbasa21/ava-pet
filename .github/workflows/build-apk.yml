name: Build AVA PET APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ava-pet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    env:
      HOME: /home/runner
      BUILDOZER_HOME: /home/runner/.buildozer
      GRADLE_USER_HOME: /home/runner/.gradle
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/28.2.13676358
      P4A_HOME: /home/runner/.buildozer/android/platform/python-for-android
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      ACCEPT_EULA: "Y"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget ca-certificates \
            ant autoconf automake autopoint libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev \
            cmake build-essential patch ccache

      - name: Install Buildozer
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "cython==0.29.37" virtualenv
          buildozer --version
          cython --version

      # Use a maintained SDK setup action instead of manually downloading
      # command-line tools and piping license prompts. This removes the two
      # recurring CI failures: missing sdkmanager/tools/bin and license exit 1.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-30
            build-tools;35.0.0
            ndk;28.2.13676358

      - name: Verify Android toolchain
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          java -version
          python --version
          buildozer --version

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -d "$ANDROID_HOME/platforms/android-30"
          test -f "$ANDROID_NDK_HOME/source.properties"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          # Buildozer/p4a versions still probe the legacy sdkmanager location.
          # Keep a compatibility symlink so the runner cannot regress here.
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sfn "$SDKMANAGER" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Validate project configuration
        run: |
          set -euxo pipefail
          test -f buildozer.spec
          test -f main.py
          grep -q '^requirements = python3,kivy,pyjnius' buildozer.spec
          grep -q '^android.api = 30' buildozer.spec
          grep -q '^android.minapi = 24' buildozer.spec
          grep -q '^android.ndk_api = 24' buildozer.spec
          grep -q '^android.archs = arm64-v8a' buildozer.spec
          grep -q '^p4a.commit = 58d2114' buildozer.spec

      - name: Prepare clean writable build directories
        run: |
          set -euxo pipefail
          sudo rm -rf /root/.buildozer /root/.gradle
          rm -rf "$BUILDOZER_HOME" "$GRADLE_USER_HOME" .buildozer bin
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build debug APK
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          mkdir -p "$BUILDOZER_HOME" "$GRADLE_USER_HOME"
          chmod -R u+rwX "$BUILDOZER_HOME" "$GRADLE_USER_HOME"

          # log_level=1 prevents Buildozer from adding p4a's enormous --debug
          # argument. The final failure summary below still preserves useful
          # diagnostics without flooding the Actions UI with compiler commands.
          buildozer android debug 2>&1 | tee /tmp/ava-pet-build.log

      - name: Verify APK
        if: success()
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Build failure summary
        if: failure()
        run: |
          set +e
          echo "===== AVA PET BUILD FAILURE SUMMARY ====="
          if [ -f /tmp/ava-pet-build.log ]; then
            echo "--- Last 160 lines ---"
            tail -n 160 /tmp/ava-pet-build.log
            echo "--- Error lines ---"
            grep -E -i 'error:|exception|traceback|failed|failure|exit code|command failed' /tmp/ava-pet-build.log | tail -n 100 || true
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
