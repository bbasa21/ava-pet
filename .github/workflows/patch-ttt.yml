name: Patch Tic Tac Toe Integration

on:
  push:
    paths-ignore:
      - '.github/workflows/patch-ttt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')

          import_line = 'from ava_tictactoe import install_tictactoe\n'
          anchor = 'from snake_ladder import build_snake_ladder_page, SnakeLadderGame\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Could not find main.py import anchor')
              text = text.replace(anchor, anchor + import_line, 1)

          old = 'if __name__ == "__main__":\n\n    AvaPetApp().run()'
          new = 'if __name__ == "__main__":\n\n    install_tictactoe(AvaPetApp, FONT_NAME)\n    AvaPetApp().run()'

          if old in text and 'install_tictactoe(AvaPetApp, FONT_NAME)' not in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          if git diff --cached --quiet; then
            echo 'No patch needed.'
          else
            git commit -m 'Integrate Tic-Tac-Toe UI into AVA PET'
            git push
          fi
