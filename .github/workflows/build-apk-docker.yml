name: Build AVA PET APK (Kivy Docker - Release)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ava-pet-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK in official Kivy container
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Integrate Tic-Tac-Toe UI
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')

          import_line = 'from ava_tictactoe import install_tictactoe\n'
          anchor = 'from snake_ladder import build_snake_ladder_page, SnakeLadderGame\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Could not find main.py import anchor')
              text = text.replace(anchor, anchor + import_line, 1)

          old = 'if __name__ == "__main__":\n\n    AvaPetApp().run()'
          new = 'if __name__ == "__main__":\n\n    install_tictactoe(AvaPetApp, FONT_NAME)\n    AvaPetApp().run()'
          if old in text and 'install_tictactoe(AvaPetApp, FONT_NAME)' not in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet -- main.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add main.py
            git commit -m 'Integrate Tic-Tac-Toe UI into AVA PET'
            git push
          fi

      - name: Verify Python syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile main.py ava_games.py ava_tictactoe.py snake_ladder.py

      - name: Pull official Kivy Buildozer image
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Prepare release signing key
        env:
          AVA_RELEASE_KEYSTORE_B64: ${{ secrets.AVA_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$AVA_RELEASE_KEYSTORE_B64" ]; then
            echo 'Release signing keystore secret is missing.'
            exit 1
          fi
          printf '%s' "$AVA_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ava-pet-release.keystore"
          test -s "$RUNNER_TEMP/ava-pet-release.keystore"

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.AVA_RELEASE_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.AVA_RELEASE_KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.AVA_RELEASE_KEYALIAS_PASSWD }}
        run: |
          set -euo pipefail
          if [ -z "$P4A_RELEASE_KEYSTORE_PASSWD" ] || [ -z "$P4A_RELEASE_KEYALIAS" ] || [ -z "$P4A_RELEASE_KEYALIAS_PASSWD" ]; then
            echo 'One or more release signing secrets are missing.'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/buildozer-cache"
          docker run --rm             --volume "$GITHUB_WORKSPACE:/home/user/hostcwd"             --volume "$RUNNER_TEMP/buildozer-cache:/home/user/.buildozer"             --volume "$RUNNER_TEMP/ava-pet-release.keystore:/home/user/ava-pet-release.keystore"             --workdir /home/user/hostcwd             -e P4A_RELEASE_KEYSTORE=/home/user/ava-pet-release.keystore             -e P4A_RELEASE_KEYSTORE_PASSWD             -e P4A_RELEASE_KEYALIAS             -e P4A_RELEASE_KEYALIAS_PASSWD             ghcr.io/kivy/buildozer:latest             android release

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-release-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p ota
          cp "$APK" bin/AVA-PET-release.apk
          python3 - "$APK" buildozer.spec <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          apk_path, spec_path = sys.argv[1:3]
          spec = open(spec_path, encoding="utf-8").read()
          version_match = re.search(r"^version\s*=\s*([^\s#]+)", spec, re.M)
          code_match = re.search(r"^android\.numeric_version\s*=\s*(\d+)", spec, re.M)
          if not version_match or not code_match:
              raise SystemExit("Could not read version/versionCode from buildozer.spec")
          digest = hashlib.sha256()
          with open(apk_path, "rb") as apk:
              for chunk in iter(lambda: apk.read(1024 * 1024), b""):
                  digest.update(chunk)
          repository = os.environ["GITHUB_REPOSITORY"]
          metadata = {
              "version_name": version_match.group(1),
              "version_code": int(code_match.group(1)),
              "apk_url": f"https://github.com/{repository}/releases/download/ota-latest/AVA-PET-release.apk",
              "sha256": digest.hexdigest(),
          }
          with open("ota/update.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output, indent=2)
              output.write("\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Publish OTA release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-latest
          name: AVA PET OTA Channel
          body: "Latest signed AVA PET Android update. Install through the app's Check for Updates button."
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            bin/AVA-PET-release.apk
            ota/update.json

      - name: Upload Buildozer environment on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-buildozer-failure-log
          path: |
            .buildozer/**/*.log
            .buildozer/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
