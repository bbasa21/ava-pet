name: Build AVA PET APK (Kivy Docker - Release)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ava-pet-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK in official Kivy container
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Integrate Tic-Tac-Toe UI
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')

          import_line = 'from ava_tictactoe import install_tictactoe\n'
          anchor = 'from snake_ladder import build_snake_ladder_page, SnakeLadderGame\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Could not find main.py import anchor')
              text = text.replace(anchor, anchor + import_line, 1)

          old = 'if __name__ == "__main__":\n\n    AvaPetApp().run()'
          new = 'if __name__ == "__main__":\n\n    install_tictactoe(AvaPetApp, FONT_NAME)\n    AvaPetApp().run()'
          if old in text and 'install_tictactoe(AvaPetApp, FONT_NAME)' not in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet -- main.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add main.py
            git commit -m 'Integrate Tic-Tac-Toe UI into AVA PET'
            git push
          fi

      - name: Verify Python syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile main.py ava_games.py ava_tictactoe.py snake_ladder.py

      - name: Pull official Kivy Buildozer image
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Build debug APK
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/buildozer-cache"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            --volume "$RUNNER_TEMP/buildozer-cache:/home/user/.buildozer" \
            --workdir /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Buildozer environment on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-buildozer-failure-log
          path: |
            .buildozer/**/*.log
            .buildozer/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
