name: Build AVA PET APK (Kivy Docker)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ava-pet-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK in official Kivy container
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull official Kivy Buildozer image
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Build debug APK
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/buildozer-cache"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            --volume "$RUNNER_TEMP/buildozer-cache:/home/user/.buildozer" \
            --workdir /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Buildozer environment on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-buildozer-failure-log
          path: |
            .buildozer/**/*.log
            .buildozer/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
