name: Build AVA PET APK (Kivy Docker)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ava-pet-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK in official Kivy container
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wire Snake & Ladder into AVA PET
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          games_path = Path("ava_games.py")
          main_path = Path("main.py")

          games = games_path.read_text(encoding="utf-8")
          main = main_path.read_text(encoding="utf-8")

          # Add the game to the existing Games list.
          snake_entry = '    ("SNAKE_LADDER", "SNAKE & LADDER", "ALI VS AVA"),\n'
          if '"SNAKE_LADDER"' not in games:
              anchor = '    ("LOGIC_BATTLE", "LOGIC BATTLE", "ALI VS AVA"),\n'
              if anchor not in games:
                  raise SystemExit("Could not find AVAILABLE_GAMES insertion point")
              games = games.replace(anchor, anchor + snake_entry, 1)
              games_path.write_text(games, encoding="utf-8")

          # Import the native Kivy Snake & Ladder module.
          import_anchor = 'from ava_games import AVAILABLE_GAMES, game_load_command\n'
          snake_import = 'from snake_ladder import build_snake_ladder_page, SnakeLadderGame\n'
          if snake_import not in main:
              if import_anchor not in main:
                  raise SystemExit("Could not find main.py import insertion point")
              main = main.replace(import_anchor, import_anchor + snake_import, 1)

          # Route SNAKE_LADDER before the generic GAME_LOAD BLE path.
          branch = (
              '        if game_id == "SNAKE_LADDER":\n'
              '            self.game_id = "SNAKE_LADDER"\n'
              '            self.show_snake_ladder()\n'
              '            return\n\n'
          )
          if 'if game_id == "SNAKE_LADDER":' not in main:
              signature = re.compile(
                  r'(    def select_game\(\n'
                  r'        self,\n'
                  r'        game_id,\n'
                  r'        _button_event=False,\n'
                  r'    \):\n)'
              )
              if not signature.search(main):
                  raise SystemExit("Could not find select_game() signature")
              main = signature.sub(r'\1\n' + branch, main, count=1)

          # Add Snake page/controller methods before the existing Games-page method.
          if '    def show_snake_ladder(self):\n' not in main:
              methods = textwrap.dedent('''
                  def show_snake_ladder(self):
                      if getattr(self, "snake_page", None) is None:
                          (
                              self.snake_page,
                              self.snake_board,
                              self.snake_status,
                              self.snake_dice,
                              self.snake_turn,
                              self.snake_roll_button,
                          ) = build_snake_ladder_page(
                              FONT_NAME,
                              self.back_to_games,
                              self.roll_snake_ladder,
                              self.reset_snake_ladder,
                          )

                          self.snake_game = SnakeLadderGame(
                              self.snake_board,
                              self.snake_status,
                              self.snake_dice,
                              self.snake_turn,
                          )

                          self.snake_game.on_dice_result = self.snake_dice_result
                          self.snake_game.on_position_change = self.snake_position_change

                          self.snake_page.opacity = 0
                          self.snake_page.disabled = True
                          self.root_layout.add_widget(self.snake_page)

                      self.connect_button.opacity = 0
                      self.connect_button.disabled = True

                      for page_name in (
                          "finding_page",
                          "home_page",
                          "games_page",
                          "math_page",
                          "logic_page",
                          "settings_page",
                      ):
                          page = getattr(self, page_name, None)
                          if page is not None:
                              page.opacity = 0
                              page.disabled = True

                      self.snake_page.opacity = 1
                      self.snake_page.disabled = False
                      self.root_layout.remove_widget(self.snake_page)
                      self.root_layout.add_widget(self.snake_page)
                      self.snake_game.reset()
                      self.add_log("SNAKE & LADDER OPENED")

                  def roll_snake_ladder(self):
                      if getattr(self, "snake_game", None) is None:
                          return
                      self.snake_game.roll()
                      self.add_log("SNAKE DICE ROLL")

                  def reset_snake_ladder(self):
                      if getattr(self, "snake_game", None) is None:
                          return
                      self.snake_game.reset()
                      self.add_log("SNAKE & LADDER RESET")

                  def snake_dice_result(self, player, result):
                      self.add_log(
                          f"SNAKE DICE RESULT | PLAYER={player} | DICE={result}"
                      )

                  def snake_position_change(self, player, target, ali_position, ava_position):
                      self.add_log(
                          f"SNAKE POSITION | PLAYER={player} | TARGET={target} | "
                          f"ALI={ali_position} | AVA={ava_position}"
                      )

              ''')
              methods = textwrap.indent(methods.lstrip(), "    ")
              back_anchor = '    def back_to_games(self):\n'
              if back_anchor not in main:
                  raise SystemExit("Could not find back_to_games() insertion point")
              main = main.replace(back_anchor, methods + back_anchor, 1)

          main_path.write_text(main, encoding="utf-8")
          print("Snake & Ladder wiring check/patch complete.")
          PY

      - name: Commit Snake & Ladder wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py ava_games.py
          if git diff --cached --quiet; then
            echo "Snake & Ladder wiring already present."
          else
            git commit -m "Wire Snake and Ladder into AVA PET"
            git push
          fi

      - name: Verify Python syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile main.py ava_games.py snake_ladder.py

      - name: Pull official Kivy Buildozer image
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Build debug APK
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/buildozer-cache"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            --volume "$RUNNER_TEMP/buildozer-cache:/home/user/.buildozer" \
            --workdir /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Buildozer environment on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AVA-PET-buildozer-failure-log
          path: |
            .buildozer/**/*.log
            .buildozer/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
